[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "change-orders"
version = "0.1.0"
description = "Change orders (variations) after a signed BOQ: add, remove or change quantities, money difference, vendor-order guards, plan shifts, payment milestones."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hexaspace" }]
keywords = ["change order", "variation order", "boq", "construction", "interior design", "project management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/change_orders"]
